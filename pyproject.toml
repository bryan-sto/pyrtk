[project]
name = "pyrtk"
version = "0.1.0"
description = "Local RTK-equivalent proxy and MCP server for token compression."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
pyrtk = "main:app"
rtk-mcp = "mcp_server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
