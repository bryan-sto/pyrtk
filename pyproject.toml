[project]
name = "pyrtk"
version = "0.1.0"
description = "Local RTK-equivalent proxy and MCP server for token compression."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
pyrtk = "pyrtk.cli:app"
pyrtk-mcp = "pyrtk.mcp_server:main"
rtk-mcp = "pyrtk.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
